# Anomalia Platform — Local Development Stack
#
# Usage:
#   cp .env.example .env        # adjust if needed
#   docker compose up --build
#
# Services
#   azurite              Azure Storage emulator  (Blob :10000 / Queue :10001 / Table :10002)
#   sql-edge             SQL Server 2022          (required by Service Bus emulator)
#   servicebus-emulator  Azure Service Bus emulator  (AMQP :5672)
#   ingestion-func       Python 3.11 Azure Functions  (:7071 → container :80)
#   processing-func      .NET 10 Azure Functions      (:7072 → container :80)
#
# Functions host healthchecks authenticate to /admin/host/status with a fixed,
# dev-only master key (infrastructure/functions-secrets/host.json, gitignored —
# never commit it, never reuse it outside this local stack). Both function base
# images (mcr.microsoft.com/azure-functions/python and .../dotnet-isolated) run
# the same host binaries out of /azure-functions-host, so file-based secret
# storage lives at the same path in both: /azure-functions-host/Secrets/host.json,
# activated by AzureWebJobsSecretStorageType=files.

x-functions-master-key: &functions-master-key "LOCAL-DEV-ONLY-MASTER-KEY-DO-NOT-USE-IN-PROD"

services:

  # ── Azure Storage Emulator ──────────────────────────────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    volumes:
      - azurite_data:/data
    healthcheck:
      # 127.0.0.1, not "localhost" — this image's /etc/hosts resolves localhost to
      # ::1 first, and Azurite binds 0.0.0.0 (IPv4-only), so "localhost" always fails.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SQL Server (Service Bus Emulator dependency) ────────────────────────────
  sql-edge:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-edge
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - sqledge_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/1433' && echo OK || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Azure Service Bus Emulator ──────────────────────────────────────────────
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: servicebus-emulator
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sql-edge
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - ./servicebus-emulator/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
    depends_on:
      sql-edge:
        condition: service_healthy
    # No healthcheck: this image ships no shell and no coreutils (confirmed — `docker exec`
    # of sh/ls/dotnet all fail with "executable file not found in $PATH"), so no CMD-SHELL
    # or exec-form check can run inside it. Dependents key off service_started instead.
    healthcheck:
      test: ["NONE"]

  # ── Ingestion Function (Python 3.11) ────────────────────────────────────────
  ingestion-func:
    build:
      context: ./services/ingestion-func
      dockerfile: Dockerfile
      target: runtime
    container_name: ingestion-func
    env_file:
      - .env
    environment:
      FUNCTIONS_WORKER_RUNTIME: python
      # Storage — point to Azurite service (UseDevelopmentStorage=true only resolves 127.0.0.1)
      AzureWebJobsStorage: "${AZURE_STORAGE_CONNECTION}"
      TableStorageConnection__tableServiceUri: "http://azurite:10002/devstoreaccount1"
      # Service Bus — emulator connection string (replaces __fullyQualifiedNamespace for dev)
      ServiceBusConnection: "${SERVICEBUS_CONNECTION}"
      # File-based secret storage — see header comment. Mounted below at
      # /azure-functions-host/Secrets/host.json.
      AzureWebJobsSecretStorageType: files
      FUNCTIONS_MASTER_KEY: *functions-master-key
    volumes:
      - ./infrastructure/functions-secrets/host.json:/azure-functions-host/Secrets/host.json:ro
    ports:
      # Container listens on :80 (the base image's default), not :7071 — the
      # previous "7071:7071" mapping pointed at a port nothing was bound to.
      - "7071:80"
    depends_on:
      azurite:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
    healthcheck:
      # Authenticated /admin/host/status: only 200s once the WebJobs Script host
      # has finished initializing *and* every extension (storage, Service Bus)
      # reports healthy — an invalid AzureWebJobsStorage key or an invalid
      # FUNCTIONS_WORKER_RUNTIME both keep it out of "Running". FUNCTIONS_MASTER_KEY
      # is a plain env var we set above purely so this shell command can read it —
      # the Functions host itself only reads the key from the mounted host.json.
      test: ["CMD-SHELL", "curl -s -H \"x-functions-key: $$FUNCTIONS_MASTER_KEY\" http://localhost:80/admin/host/status | grep -q '\"state\":\"Running\"'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Processing Function (.NET 10) ───────────────────────────────────────────
  processing-func:
    build:
      context: ./services/processing-func
      dockerfile: Dockerfile
      target: runtime
    container_name: processing-func
    env_file:
      - .env
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      # Storage — Azurite
      AzureWebJobsStorage: "${AZURE_STORAGE_CONNECTION}"
      ADLS_ENDPOINT: "http://azurite:10000/devstoreaccount1"
      ONELAKE_ENDPOINT: "http://azurite:10000/devstoreaccount1"
      SCHEMA_REGISTRY_BLOB_CONNECTION: "${AZURE_STORAGE_CONNECTION}"
      # Service Bus — emulator connection string
      ServiceBusConnection: "${SERVICEBUS_CONNECTION}"
      # File-based secret storage — see header comment. Mounted below at
      # /azure-functions-host/Secrets/host.json.
      AzureWebJobsSecretStorageType: files
      FUNCTIONS_MASTER_KEY: *functions-master-key
    volumes:
      - ./infrastructure/functions-secrets/host.json:/azure-functions-host/Secrets/host.json:ro
    ports:
      - "7072:80"
    depends_on:
      azurite:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
    healthcheck:
      # See ingestion-func's healthcheck comment: authenticated /admin/host/status,
      # requiring the top-level "state":"Running" (not just a reachable endpoint).
      test: ["CMD-SHELL", "curl -s -H \"x-functions-key: $$FUNCTIONS_MASTER_KEY\" http://localhost/admin/host/status | grep -q '\"state\":\"Running\"'"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  azurite_data:
  sqledge_data:
